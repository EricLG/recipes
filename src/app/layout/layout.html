@if (showLayout()) {
<input #menuToggle type="checkbox" id="menu-toggle" class="menu-toggle"/>

<header class="navbar navbar-dark {{ bgColor }} ps-3">
    <label for="menu-toggle" class="menu-button d-xl-none">
        <span class="hamburger"></span>
    </label>
    <a routerLink="/" class="navbar-brand font-cinzel fw-bold text-white">La taverne de May</a>
    <div class="ms-auto me-3">
        @if (!isLoggedIn()) {
            <a routerLink="/login" class="btn btn-outline-light">Connexion</a>
        } @else {
            <a routerLink="/profile" class="btn btn-outline-light">Mon profil</a>
        }
    </div>
</header>

<div class="layout">

    <!-- sidebar -->
    <aside class="sidebar">
        <div class="logo-wrapper">
            <img src="assets/may_picto.png" class="logo-img pointer" (click)="goHome()"/>
        </div>

        <div class="p-3">
            @if (isAdmin()) {
                <app-link display="btn" label="Créer une recette" routerLink="/recipes/add" iconName="create_recipe.png" iconSize="l"></app-link>
            }

            <ul class="nav mt-2">
                @for (link of links; track link) {
                    <li class="w-100">
                        <app-link display="list" (click)="closeMenu(menuToggle); goToAllRecipes(link.path)" [label]="link.title" [routerLink]="link.path" [iconName]="link.icon" iconSize="l"> </app-link>
                    </li>
                }
            </ul>
        </div>
    </aside>

    <!-- main -->
    <main class="main-area">
        <div>
            <app-search-filters></app-search-filters>
        </div>
        <div class="content-area">
            <router-outlet></router-outlet>
        </div>
    </main>

    <!-- footer -->
    <footer class="footer">
        <p class="text-center mb-0">&copy; 2026 La taverne de May. Tous droits réservés.</p>
    </footer>
</div>

<label for="menu-toggle" class="menu-backdrop"></label>
} @else {
    <router-outlet></router-outlet>
}
